AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aussie EcoLens - Track 1 AWS Ingestion Core

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.11
    Architectures: [x86_64]

Parameters:
  Suffix:
    Type: String
    Description: Globally-unique suffix for bucket names (e.g. slee4827)
  LabRoleArn:
    Type: String
    Description: ARN of the pre-baked LabRole from AWS Academy

Resources:

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ecolens-raw-${Suffix}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt IngestTriggerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ThumbsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ecolens-thumbs-${Suffix}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FramesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ecolens-frames-${Suffix}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  QueryTmpBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ecolens-query-tmp-${Suffix}
      LifecycleConfiguration:
        Rules:
          - Id: expire-query-uploads
            Status: Enabled
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FileChecksumsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: file_checksums
      AttributeDefinitions:
        - AttributeName: checksum
          AttributeType: S
      KeySchema:
        - AttributeName: checksum
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  IngestTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecolens-ingest-trigger
      CodeUri: lambdas/ingest_trigger/
      Handler: app.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          RAW_BUCKET: !Sub ecolens-raw-${Suffix}
          THUMBS_BUCKET: !Sub ecolens-thumbs-${Suffix}
          FRAMES_BUCKET: !Sub ecolens-frames-${Suffix}
          CHECKSUMS_TABLE: !Ref FileChecksumsTable

  IngestTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt IngestTriggerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::ecolens-raw-${Suffix}

Outputs:
  RawBucket:            { Value: !Ref RawBucket }
  ThumbsBucket:         { Value: !Ref ThumbsBucket }
  FramesBucket:         { Value: !Ref FramesBucket }
  QueryTmpBucket:       { Value: !Ref QueryTmpBucket }
  ChecksumsTable:       { Value: !Ref FileChecksumsTable }
  IngestTriggerArn:     { Value: !GetAtt IngestTriggerFunction.Arn }
